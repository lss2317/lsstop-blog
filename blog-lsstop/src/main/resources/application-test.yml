# 本地开发环境配置（模板）

# 服务器配置
server:
  # 端口号
  port: 8080
  servlet:
    session:
      # 会话超时时间（秒）
      timeout: 21600

spring:
  # 数据源配置
  datasource:
    # 数据库连接地址
    url: jdbc:mysql://localhost:3306/your-database?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # 数据库用户名
    username: your-username
    # 数据库密码
    password: your-password
    # 数据库驱动
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 配置
  data:
    redis:
      # Redis 服务器地址
      host: localhost
      # Redis 端口
      port: 6379
      # Redis 密码（无密码留空）
      password: your-redis-password
      # Redis 数据库索引
      database: 0
      # 连接超时时间
      timeout: 10000ms
      # Lettuce 连接池配置
      lettuce:
        pool:
          # 最大连接数
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数（保持至少1个空闲连接）
          min-idle: 1
          # 获取连接最大等待时间（-1表示无限制）
          max-wait: -1ms

  # RabbitMQ 配置
  rabbitmq:
    # RabbitMQ 服务器地址
    host: localhost
    # RabbitMQ 端口
    port: 5672
    # RabbitMQ 用户名
    username: your-rabbitmq-username
    # RabbitMQ 密码
    password: your-rabbitmq-password
    # 发布确认类型（correlated: 异步确认）
    publisher-confirm-type: correlated
    listener:
      simple:
        # 消费者确认模式（manual: 手动确认）
        acknowledge-mode: manual
        # 每次从队列获取的消息数量
        prefetch: 1

  # 邮箱配置 (QQ邮箱)
  mail:
    # SMTP 服务器地址
    host: smtp.qq.com
    # SMTP 端口 (SSL)
    port: 465
    # QQ 邮箱账号
    username: your-qq-email@qq.com
    # QQ 邮箱授权码 (非QQ密码)
    password: your-qq-authorization-code
    # 默认编码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # 启用认证
          auth: true
          ssl:
            # 启用 SSL
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

# 博客配置
blog:
  # 博客名称 (用于邮件模板)
  name: Your Blog Name
  # 博主邮箱 (用于接收评论通知)
  owner-email: your-owner-email@qq.com
  # 博客前台地址 (用于邮件链接)
  url: https://your-blog-url.com
  # 默认用户昵称前缀
  default-nickname-prefix: 用户

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # SQL日志打印到控制台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # Mapper XML 文件位置
  mapper-locations: classpath*:/mapper/*.xml

# JWT配置
jwt:
  # 密钥（至少256位，生产环境请更换）
  secret: your-jwt-secret-key-must-be-at-least-256-bits-long
  # 前台配置
  front:
    # Access Token 过期时间：30分钟（毫秒）
    access-token-expiration: 1800000
    # Refresh Token 过期时间：3天（毫秒）
    refresh-token-expiration: 259200000
  # 后台配置
  admin:
    # Access Token 过期时间：10分钟（毫秒）
    access-token-expiration: 600000
    # Refresh Token 过期时间：1天（毫秒）
    refresh-token-expiration: 86400000

# 腾讯云 COS 配置
cos:
  # SecretId（从腾讯云控制台获取）
  secret-id: your-secret-id
  # SecretKey（从腾讯云控制台获取）
  secret-key: your-secret-key
  # 存储桶所在地域（如：ap-shanghai、ap-guangzhou）
  region: ap-shanghai
  # 存储桶名称（格式：bucket-appid）
  bucket-name: your-bucket-1250000000
  # 访问域名
  domain: https://your-bucket-1250000000.cos.ap-shanghai.myqcloud.com
  # 上传目录前缀
  path-prefix: blog/
