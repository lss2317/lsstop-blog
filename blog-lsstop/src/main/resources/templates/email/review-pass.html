<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px;">
        <!-- Header -->
        <div style="padding: 24px 32px;">
            <span style="font-size: 20px; font-weight: 600; color: #22c55e;" th:text="${blogName}">Blog</span>
        </div>
        <!-- Content -->
        <div style="padding: 0 32px 32px;">
            <h1 style="font-size: 24px; font-weight: 700; color: #22c55e; margin: 0 0 24px; text-align: center;">审核通过</h1>
            <p style="font-size: 15px; color: #4a4a4a; margin: 0 0 24px; line-height: 1.7;">您好，</p>
            <p style="font-size: 15px; color: #4a4a4a; margin: 0 0 24px; line-height: 1.7;">您在<span th:text="${topicType}"></span> <span style="color: #22c55e; font-weight: 500;" th:text="${topic}"></span> 的评论已通过审核：</p>
            <div style="background: #f9fafb; border-left: 4px solid #22c55e; padding: 16px 20px; margin-bottom: 32px;">
                <p style="font-size: 15px; color: #1a1a1a; margin: 0; line-height: 1.6;" th:text="${content}"></p>
            </div>
            <div style="text-align: center;">
                <a th:href="${url}" style="display: inline-block; padding: 12px 24px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 500;">查看详情</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
