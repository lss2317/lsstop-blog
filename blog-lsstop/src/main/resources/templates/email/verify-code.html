<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px;">
        <!-- Header -->
        <div style="padding: 24px 32px;">
            <span style="font-size: 20px; font-weight: 600; color: #22c55e;" th:text="${blogName}">Blog</span>
        </div>
        <!-- Content -->
        <div style="padding: 0 32px 32px;">
            <h1 style="font-size: 24px; font-weight: 700; color: #22c55e; margin: 0 0 24px; text-align: center;">验证码</h1>
            <p style="font-size: 15px; color: #4a4a4a; margin: 0 0 24px; line-height: 1.7;">您好，</p>
            <p style="font-size: 15px; color: #4a4a4a; margin: 0 0 24px; line-height: 1.7;">您正在进行身份验证，验证码如下：</p>
            <div style="background: #f9fafb; border-left: 4px solid #22c55e; padding: 20px 24px; margin-bottom: 24px;">
                <span style="font-size: 32px; font-weight: 700; color: #1a1a1a; letter-spacing: 8px; font-family: 'SF Mono', Monaco, Consolas, monospace;" th:text="${code}">123456</span>
            </div>
            <p style="font-size: 14px; color: #6b7280; margin: 0 0 32px; line-height: 1.6;">验证码在 <span th:text="${expireMinutes} ?: 5">5</span> 分钟内有效，请勿泄露给他人。</p>
            <p style="font-size: 14px; color: #9ca3af; margin: 0; line-height: 1.6;">如果这不是您的操作，请忽略此邮件。</p>
        </div>
    </div>
</div>
</body>
</html>
